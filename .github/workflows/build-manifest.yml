name: Build Manifest

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.md"
      - "scripts/build-manifest.mjs"

jobs:
  check-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild manifest
        run: node scripts/build-manifest.mjs

      - name: Fail if manifest is out of date
        run: |
          if ! git diff --quiet manifest.json; then
            echo "::error::manifest.json is out of date. Run 'node scripts/build-manifest.mjs' locally and commit the result."
            git diff manifest.json
            exit 1
          fi
